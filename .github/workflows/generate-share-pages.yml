name: Generate share preview pages

on:
  push:
    branches: [ index ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: index

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate share pages
        run: npm run generate-share-pages

      - name: Commit and push generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add share/
          if git diff --cached --quiet; then
            echo "Нет изменений в превью-страницах."
          else
            git commit -m "chore: обновлены превью-страницы для соцсетей [skip ci]"
            git push
          fi
