<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Секретные сеты - Mobitva(МоБитва)">
    <meta property="og:description" content="Секретные сеты Mobitva — коллекции редкой экипировки в игре МоБитва.">

    <style>
        .secret-sets-container{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}
        
        /* Спиннер загрузки */
        .loading-spinner{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center;}
        .spinner{width:50px;height:50px;border:4px solid rgba(199,186,0,0.2);border-top:4px solid #c7ba00;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px;}
        .loading-text{color:#c7ba00;font-size:14px;letter-spacing:1px;}
        @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
        
        .set-card{background:linear-gradient(135deg,#1e1a14,#14110d);border:none;border-radius:20px;overflow:hidden;transition:all 0.3s;cursor:pointer;box-shadow:0 6px 14px rgba(0,0,0,0.4);position:relative;}
        .set-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;z-index:1;}
        .set-card.rare::before{background:linear-gradient(90deg,#4caf50,#8bc34a,#4caf50);box-shadow:0 0 8px rgba(76,175,80,0.5);}
        .set-card.uncommon::before{background:linear-gradient(90deg,#2196f3,#64b5f6,#2196f3);box-shadow:0 0 8px rgba(33,150,243,0.5);}
        .set-card.armor::before{background:linear-gradient(90deg,#f44336,#ef9a9a,#f44336);box-shadow:0 0 8px rgba(244,67,54,0.5);}
        .set-card.epic::before{background:linear-gradient(90deg,#ffeb3b,#fff59d,#ffeb3b);box-shadow:0 0 8px rgba(255,235,59,0.5);}
        .set-card.nostyle::before{background:linear-gradient(90deg,#888,#bbb,#888);box-shadow:none;}
        .set-card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(199,186,0,0.3);}
        .set-card-header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;background:linear-gradient(135deg,#2a2420,#1f1b17);gap:15px;}
        .set-card-info{flex:1;text-align:center;}
        .set-card-name{font-size:22px;font-weight:bold;background:linear-gradient(135deg,#ffdd88,#e8c84a);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px;text-shadow:0 0 20px rgba(199,186,0,0.3);}
        .set-card-details{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
        .set-card-style{font-size:11px;padding:4px 14px;border-radius:30px;background:rgba(0,0,0,0.5);font-weight:bold;transition:0.2s;}
        .set-card-style.rare{color:#6fbf6f;border:1px solid #6fbf6f;box-shadow:0 0 8px rgba(111,191,111,0.3);}
        .set-card-style.uncommon{color:#6f9fdf;border:1px solid #6f9fdf;box-shadow:0 0 8px rgba(111,159,223,0.3);}
        .set-card-style.armor{color:#df8f6f;border:1px solid #df8f6f;box-shadow:0 0 8px rgba(223,143,111,0.3);}
        .set-card-style.epic{color:#dfcf6f;border:1px solid #dfcf6f;box-shadow:0 0 8px rgba(223,207,111,0.3);}
        .set-card-style.nostyle{color:#aaa;border:1px solid #666;}
        .set-card-style:hover{transform:scale(1.05);}
        .set-card-level{font-size:11px;color:#ffaa44;background:rgba(0,0,0,0.5);padding:4px 14px;border-radius:30px;font-weight:bold;box-shadow:0 0 6px rgba(255,170,68,0.2);}
        .set-card-toggle{font-size:24px;color:#c7ba00;transition:0.2s;width:32px;text-align:center;text-shadow:0 0 6px rgba(199,186,0,0.5);}
        .set-card-toggle:hover{transform:scale(1.1);color:#ffdd88;}
        .set-card-items{padding:20px 24px;border-top:1px solid rgba(199,186,0,0.2);display:flex;flex-direction:column;gap:12px;background:linear-gradient(135deg,#0d0a07,#0a0806);}
        .set-item-card{display:flex;align-items:center;gap:18px;padding:12px 18px;background:linear-gradient(95deg,#16120e,#12100c);border-radius:16px;cursor:pointer;transition:0.2s;border:1px solid rgba(199,186,0,0.1);position:relative;overflow:hidden;}
        .set-item-card::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(199,186,0,0.08),transparent);transition:0.4s;}
        .set-item-card:hover{background:#201c18;border-color:#c7ba00;transform:translateX(8px);}
        .set-item-card:hover::before{left:100%;}
        .set-item-icon{width:80px;height:80px;border-radius:12px;background-color:#0a0806;border:1px solid #c7ba00;box-shadow:0 0 8px rgba(199,186,0,0.2);transition:0.2s;}
        .set-item-card:hover .set-item-icon{box-shadow:0 0 12px rgba(199,186,0,0.5);}
        .set-item-info{flex:1;}
        .set-item-name{font-size:16px;font-weight:bold;color:#ffdd88;margin-bottom:4px;transition:0.2s;}
        .set-item-card:hover .set-item-name{color:#ffeeaa;text-shadow:0 0 6px rgba(199,186,0,0.3);}
        .set-item-level{font-size:12px;color:#c7ba00;}
        .set-item-style{font-size:11px;margin-top:3px;padding:2px 10px;border-radius:20px;display:inline-block;background:rgba(0,0,0,0.3);}
        .set-item-style.rare{color:#6fbf6f;border:1px solid #6fbf6f;text-shadow:0 0 4px rgba(111,191,111,0.3);}
        .set-item-style.uncommon{color:#6f9fdf;border:1px solid #6f9fdf;text-shadow:0 0 4px rgba(111,159,223,0.3);}
        .set-item-style.armor{color:#df8f6f;border:1px solid #df8f6f;text-shadow:0 0 4px rgba(223,143,111,0.3);}
        .set-item-style.epic{color:#dfcf6f;border:1px solid #dfcf6f;text-shadow:0 0 4px rgba(223,207,111,0.3);}
        .modal-item-style{font-size:12px;padding:4px 14px;border-radius:30px;display:inline-block;background:rgba(0,0,0,0.4);margin-top:5px;}
        .modal-item-style.rare{color:#6fbf6f;border:1px solid #6fbf6f;text-shadow:0 0 4px rgba(111,191,111,0.3);}
        .modal-item-style.uncommon{color:#6f9fdf;border:1px solid #6f9fdf;text-shadow:0 0 4px rgba(111,159,223,0.3);}
        .modal-item-style.armor{color:#df8f6f;border:1px solid #df8f6f;text-shadow:0 0 4px rgba(223,143,111,0.3);}
        .modal-item-style.epic{color:#dfcf6f;border:1px solid #dfcf6f;text-shadow:0 0 4px rgba(223,207,111,0.3);}
    </style>
</head>

<body>
    <div class="wrapper">
        <div id="adminPanel" style="display:none;">
            <div class="admin-panel">
                <div class="admin-info">
                    <div class="admin-avatar">👑</div>
                    <div>
                        <div class="admin-name" id="adminName"></div>
                        <div class="admin-role">Администратор</div>
                    </div>
                    <div class="admin-badge">ADMIN</div>
                </div>
                <div class="admin-actions">
                    <button class="admin-btn" onclick="location.href='/profile/'">👤 Профиль</button>
                    <button class="admin-btn" onclick="openAdminPanel()">⚙️ Управление</button>
                    <button class="admin-btn logout-btn" onclick="logout()">🚪 Выйти</button>
                </div>
            </div>
        </div>
        <div id="userPanel" style="display:none;">
            <div class="admin-panel">
                <div class="admin-info">
                    <div class="admin-avatar">👤</div>
                    <div>
                        <div class="admin-name" id="userName"></div>
                        <div class="admin-role">Пользователь</div>
                    </div>
                </div>
                <div class="admin-actions">

                    <button class="admin-btn logout-btn" onclick="logout()">🚪 Выйти</button>
                </div>
            </div>
        </div>

        <div class="header-wrapper">
            <a href="https://mobitva.net" target="_blank">mobitva.net</a>
            <div class="site-title">👘 СЕКРЕТНЫЕ СЕТЫ 👘</div>
            <a href="https://mmobitva.ru" target="_blank">mmobitva.ru</a>
        </div>
        <div class="categories">
            <button class="cat-btn" onclick="location.href='/'">🏠 Главная</button>
            <button class="cat-btn" onclick="location.href='/secret_items/'">🔮 Секретные вещи</button>
            <button class="cat-btn" onclick="location.reload()">🔄 Обновить</button>
        </div>

        <div class="secret-sets-container" id="secretSetsContainer">
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner"></div>
                <div class="loading-text">Загрузка сетов...</div>
            </div>
        </div>
    </div>

    <div id="itemModal" class="item-compare-modal" style="display:none!important">
        <div class="item-compare-container">
            <div class="item-card-modal">
                <div class="item-card-header">
                    <div class="item-card-close" onclick="closeItemModal()">✕</div>
                    <div class="item-card-icon">
                        <div class="shop-icon" id="itemModalIcon" style="width:80px;height:80px;"></div>
                    </div>
                    <div class="item-card-title" id="itemModalName"></div>
                    <div class="item-card-subtitle" id="itemModalStyle"></div>
                    <div class="item-card-level" id="itemModalLevel"></div>
                </div>
                <div class="item-card-body">
                    <div class="item-card-stats">
                        <div class="item-card-stats-title">📊 ХАРАКТЕРИСТИКИ</div>
                        <div id="itemModalStats"></div>
                    </div>
                    <div id="itemModalUniqueContainer" class="item-card-unique" style="display:none;">
                        <div class="item-card-unique-title">✨ УНИКАЛЬНЫЕ ХАРАКТЕРИСТИКИ</div>
                        <ul id="itemModalUniqueList" class="item-card-unique-list"></ul>
                    </div>
                    <div class="item-card-description" id="itemModalDesc"></div>
                    <div id="itemModalHowToGet" class="item-card-how-to-get" style="display:none;"></div>
                </div>
                <div class="item-card-footer">
                    <button class="close-modal-btn" onclick="closeItemModal()">Закрыть</button>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/db.js"></script>
<script src="/js/common.js"></script>
<script src="/js/statico.js"></script>
<script>
    const currentUser = checkAuth();

let secretSets = [];
    let secretSetsItems = {};

    async function loadSecretSets() {
        const spinner = document.getElementById('loadingSpinner');
        if (spinner) spinner.style.display = 'flex';
        
        secretSets = await getSecretSets();
        for (const set of secretSets) {
            const items = await getSecretSetItems(set.id);
            secretSetsItems[set.id] = items;
        }
        renderSets();
        
        if (spinner) spinner.style.display = 'none';
        return true;
    }

    function getStyleText(styleValue) {
        switch (styleValue) {
            case "rare": return "Урон";
            case "uncommon": return "Уворот";
            case "armor": return "Броня";
            case "epic": return "Элита";
            default: return styleValue || "—";
        }
    }

    function renderSets() {
        const container = document.getElementById('secretSetsContainer');
        if (!container) return;
        
        container.innerHTML = '';

        if (secretSets.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:40px;color:#a0a0a0;">📭 Секретных сетов пока нет</div>';
            return;
        }

        let html = '';
        for (const set of secretSets) {
            const items = secretSetsItems[set.id] || [];
            const styleText = getStyleText(set.style);
            const styleClass = set.style || 'nostyle';
            
            let itemsHtml = '';
            if (items.length === 0) {
                itemsHtml = '<div style="text-align:center;padding:20px;color:#a0a0a0;">📭 В этом сете пока нет предметов</div>';
            } else {
                for (const item of items) {
                    const itemStyleText = getStyleText(item.style);
                    itemsHtml += `
                        <div class="set-item-card" onclick="event.stopPropagation(); openSetItemModal(${item.id})">
                            <div class="set-item-icon shop-icon" style="--row:${item.icon_row}; --col:${item.icon_col}; width:80px; height:80px;"></div>
                            <div class="set-item-info">
                                <div class="set-item-name">${escapeHtml(item.name)}</div>
                                <div class="set-item-level">⭐ Уровень ${item.level}</div>
                                ${item.style ? `<div class="set-item-style ${item.style}">✨ Стиль: ${itemStyleText}</div>` : ''}
                            </div>
                        </div>
                    `;
                }
            }

            html += `
                <div class="set-card ${styleClass}" data-set-id="${set.id}">
                    <div class="set-card-header" onclick="toggleSet(this.parentElement)">
                        <div class="set-card-info">
                            <div class="set-card-name">👘 ${escapeHtml(set.name)}</div>
                            <div class="set-card-details">
                                <span class="set-card-style ${set.style}">✨ Стиль: ${styleText}</span>
                                <span class="set-card-level">⭐ Уровень: ${set.level}</span>
                            </div>
                        </div>
                        <div class="set-card-toggle">▼</div>
                    </div>
                    <div class="set-card-items" style="display:none;">
                        ${itemsHtml}
                    </div>
                </div>
            `;
        }
        container.innerHTML = html;
    }

    function toggleSet(cardElement) {
        const itemsContainer = cardElement.querySelector('.set-card-items');
        const toggleIcon = cardElement.querySelector('.set-card-toggle');
        
        if (itemsContainer.style.display === 'none') {
            itemsContainer.style.display = 'block';
            toggleIcon.innerHTML = '▲';
        } else {
            itemsContainer.style.display = 'none';
            toggleIcon.innerHTML = '▼';
        }
    }

    function getStyleTextForModal(styleValue) {
        switch (styleValue) {
            case "rare": return "Урон";
            case "uncommon": return "Уворот";
            case "armor": return "Броня";
            case "epic": return "Элита";
            default: return "";
        }
    }

    async function openSetItemModal(itemId) {
        const item = await getSecretSetItemById(itemId);
        if (!item) return;

        document.getElementById('itemModalIcon').style.backgroundPosition = `-${item.icon_col * 80}px -${item.icon_row * 80}px`;
        document.getElementById('itemModalName').innerText = item.name;
        
        const styleText = getStyleTextForModal(item.style);
        const styleClass = item.style || '';
        document.getElementById('itemModalStyle').innerHTML = styleText ? `<span class="modal-item-style ${styleClass}">✨ Стиль: ${styleText}</span>` : '';
        document.getElementById('itemModalLevel').innerHTML = `⭐ Уровень ${item.level}`;
        
        const statsContainer = document.getElementById('itemModalStats');
        renderStats(item.stats || {}, statsContainer);
        
        const uniqueContainer = document.getElementById('itemModalUniqueContainer');
        const uniqueList = document.getElementById('itemModalUniqueList');
        if (item.unique_stats && item.unique_stats.length > 0) {
            uniqueContainer.style.display = 'block';
            uniqueList.innerHTML = item.unique_stats.map(u => `<li>✨ ${escapeHtml(u)}</li>`).join('');
        } else {
            uniqueContainer.style.display = 'none';
        }
        
        document.getElementById('itemModalDesc').innerHTML = escapeHtml(item.description || 'Описание отсутствует');
        
        const howToGetDiv = document.getElementById('itemModalHowToGet');
        if (item.how_to_get) {
            howToGetDiv.style.display = 'block';
            howToGetDiv.innerHTML = `<div style="background:rgba(199,186,0,0.15); border-left:3px solid #c7ba00; padding:10px 12px; border-radius:8px; margin-top:12px;">
                <div style="font-size:11px; color:#c7ba00; margin-bottom:5px;">🎯 СПОСОБ ПОЛУЧЕНИЯ:</div>
                <div style="font-size:12px; color:#ffdd88;">${escapeHtml(item.how_to_get)}</div>
            </div>`;
        } else {
            howToGetDiv.style.display = 'none';
        }
        
        document.getElementById('itemModal').style.display = 'flex';
        document.body.style.overflow = 'hidden';
    }

    function closeItemModal() {
        document.getElementById('itemModal').style.display = 'none';
        document.body.style.overflow = '';
    }

    // ==================== ФУНКЦИИ ДЛЯ ОТКРЫТИЯ ИЗ URL ====================
    
    // Открытие сета по ID (разворачивает и скроллит)
    window.openSetById = function(setId) {
        console.log('openSetById called with:', setId);
        const setCard = document.querySelector(`.set-card[data-set-id="${setId}"]`);
        if (!setCard) {
            console.log('Сет не найден:', setId);
            console.log('Доступные сеты:', document.querySelectorAll('.set-card').length);
            return false;
        }
        
        const itemsContainer = setCard.querySelector('.set-card-items');
        const toggleIcon = setCard.querySelector('.set-card-toggle');
        
        if (itemsContainer && itemsContainer.style.display !== 'block') {
            itemsContainer.style.display = 'block';
            if (toggleIcon) toggleIcon.innerHTML = '▲';
        }
        
        setCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        
        setCard.style.boxShadow = '0 0 0 2px #c7ba00, 0 8px 25px rgba(199,186,0,0.5)';
        setTimeout(() => {
            setCard.style.boxShadow = '';
        }, 2000);
        
        return true;
    };
    
    // Открытие предмета внутри сета по ID
    window.openSetItemById = async function(itemId) {
        const item = await getSecretSetItemById(itemId);
        if (!item) return false;
        
        const setCard = document.querySelector(`.set-card[data-set-id="${item.set_id}"]`);
        if (setCard) {
            const itemsContainer = setCard.querySelector('.set-card-items');
            const toggleIcon = setCard.querySelector('.set-card-toggle');
            if (itemsContainer && itemsContainer.style.display !== 'block') {
                itemsContainer.style.display = 'block';
                if (toggleIcon) toggleIcon.innerHTML = '▲';
            }
            setCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        
        setTimeout(() => {
            openSetItemModal(itemId);
        }, 300);
        
        return true;
    };
    
    // Обработка параметров из URL (вызывается ПОСЛЕ полной загрузки)
    async function handleUrlParams() {
        const urlParams = new URLSearchParams(window.location.search);
        const setId = urlParams.get('set');
        const openModal = urlParams.get('open');
        
        console.log('handleUrlParams - setId:', setId, 'openModal:', openModal);
        
        if (setId && openModal === 'modal') {
            // Ждём появления карточек в DOM
            let attempts = 0;
            const maxAttempts = 20; // 20 * 200ms = 4 секунды
            
            const tryOpenSet = setInterval(() => {
                attempts++;
                const setCard = document.querySelector(`.set-card[data-set-id="${setId}"]`);
                console.log(`Попытка ${attempts}: ищем сет ${setId}, найдено:`, !!setCard);
                
                if (setCard) {
                    clearInterval(tryOpenSet);
                    window.openSetById(parseInt(setId));
                    // Удаляем параметры ТОЛЬКО после успешного открытия
                    window.history.replaceState({}, '', window.location.pathname);
                } else if (attempts >= maxAttempts) {
                    clearInterval(tryOpenSet);
                    console.log('Не удалось найти сет после', maxAttempts, 'попыток');
                }
            }, 200);
        }
    }

    // Запуск
    async function init() {
        await loadSecretSets();
        handleUrlParams();
        displayAdminPanel();
    }

    init();
</script>
</body>

</html>
