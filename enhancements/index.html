<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Усиления - Mobitva(МоБитва)</title>
    <meta name="description" content="Усиления в игре МоБитва — временные и постоянные бонусы, описание эффектов.">
    <link rel="canonical" href="https://mobitva.help/enhancements/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Усиления - Mobitva(МоБитва)">
    <meta property="og:description" content="Усиления в игре МоБитва — временные и постоянные бонусы, описание эффектов.">
    <meta property="og:url" content="https://mobitva.help/enhancements/">
    <meta property="og:image" content="https://mobitva.help/img/books.png">
    <meta property="og:locale" content="ru_RU">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/png" href="/img/books.png">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="wrapper">
        <div id="adminPanel" style="display:none;">
            <div class="admin-panel">
                <div class="admin-info">
                    <div class="admin-avatar">👑</div>
                    <div>
                        <div class="admin-name" id="adminName"></div>
                        <div class="admin-role">Администратор</div>
                    </div>
                    <div class="admin-badge">ADMIN</div>
                </div>
                <div class="admin-actions">
                    <button class="admin-btn" onclick="location.href='/profile/'">👤 Профиль</button>
                    <button class="admin-btn" onclick="openAdminPanel()">⚙️ Управление</button>
                    <button class="admin-btn logout-btn" onclick="logout()">🚪 Выйти</button>
                </div>
            </div>
        </div>
        <div id="userPanel" style="display:none;">
            <div class="admin-panel">
                <div class="admin-info">
                    <div class="admin-avatar">👤</div>
                    <div>
                        <div class="admin-name" id="userName"></div>
                        <div class="admin-role">Пользователь</div>
                    </div>
                </div>
                <div class="admin-actions">

                    <button class="admin-btn logout-btn" onclick="logout()">🚪 Выйти</button>
                </div>
            </div>
        </div>

        <div class="header-wrapper">
            <a href="https://mobitva.net" target="_blank">mobitva.net</a>
            <div class="site-title">✨ УСИЛЕНИЯ ✨</div>
            <a href="https://mmobitva.ru" target="_blank">mmobitva.ru</a>
        </div>
        <div class="categories">
            <button class="cat-btn" onclick="location.href='/'">🏠 Главная</button>
            <button class="cat-btn" onclick="location.reload()">🔄 Обновить</button>
        </div>

        <div class="type-filter">
            <button class="type-btn active" data-type="all">📦 Все</button>
            <button class="type-btn" data-type="temporary">⏳ Временные</button>
            <button class="type-btn" data-type="permanent">♾️ Постоянные</button>
        </div>

        <div class="search-bar-enh">
            <input type="text" id="searchEnhancement" placeholder="🔍 Поиск усиления...">
        </div>
        <div class="result-count-enh" id="resultCountEnh">📦 Загрузка...</div>

        <div class="enhancements-container">
            <div class="enhancement-list" id="enhancementList"></div>
        </div>
    </div>

    <div id="enhancementModal" class="rune-modal" style="display:none!important">
        <div class="rune-modal-content">
            <div class="rune-modal-header">
                <div class="rune-modal-close" onclick="closeEnhancementModal()">✕</div>
                <div class="rune-modal-icon">
                    <div class="item-icon shop-icon" id="modalIcon"
                        style="width:80px;height:80px;background-image:url('img/shop.png');background-repeat:no-repeat;">
                    </div>
                </div>
                <div class="rune-modal-title" id="modalTitle"></div>
                <div class="rune-modal-subtitle" id="modalSubtitle"></div>
            </div>
            <div class="rune-modal-body">
                <div class="rune-modal-stats">
                    <div class="rune-modal-stats-title">📊 ХАРАКТЕРИСТИКИ</div>
                    <div id="modalStats"></div>
                </div>
                <div class="rune-modal-description" id="modalDescription"></div>
            </div>
            <div class="rune-modal-footer">
                <button class="rune-modal-btn" onclick="closeEnhancementModal()">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/db.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/statico.js"></script>
    <script>
        const currentUser = checkAuth();

let allEnhancements = [];
        let currentTypeFilter = 'all';
        let currentSearch = '';

        async function loadEnhancements() {
            allEnhancements = await getEnhancements();
            filterAndRender();
        }

        function filterAndRender() {
            let filtered = [...allEnhancements];

            if (currentTypeFilter !== 'all') {
                filtered = filtered.filter(e => e.type === currentTypeFilter);
            }

            if (currentSearch !== '') {
                filtered = filtered.filter(e => e.name.toLowerCase().includes(currentSearch));
            }

            renderList(filtered);
            document.getElementById('resultCountEnh').innerHTML = `📦 Найдено: ${filtered.length} из ${allEnhancements.length}`;
        }

        function renderList(items) {
            const container = document.getElementById('enhancementList');
            if (!container) return;

            if (items.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:40px;color:#a0a0a0;">📭 Усилений не найдено</div>';
                return;
            }

            let html = '';
            for (const enh of items) {
                const typeText = enh.type === 'temporary' ? '⏳ Временное' : '♾️ Постоянное';
                const typeClass = enh.type === 'temporary' ? 'temporary' : 'permanent';

                const expiryHtml = enh.expiry_text
                    ? `<div class="enhancement-expiry">📅 Годность: ${escapeHtml(enh.expiry_text)}</div>`
                    : '';

                html += `
                <div class="enhancement-card" onclick="openEnhancementModal(${enh.id})">
                    <div class="enhancement-icon" style="--row:${enh.icon_row}; --col:${enh.icon_col};"></div>
                    <div class="enhancement-info">
                        <div class="enhancement-name">${escapeHtml(enh.name)}</div>
                        <div class="enhancement-level">⭐ Уровень ${enh.level}</div>
                        ${expiryHtml}
                    </div>
                    <div class="enhancement-badge ${typeClass}">${typeText}</div>
                </div>
            `;
            }
            container.innerHTML = html;
        }

        function openEnhancementModal(id) {
            const enh = allEnhancements.find(e => e.id === id);
            if (!enh) return;

            const iconEl = document.getElementById('modalIcon');
            iconEl.style.backgroundPosition = `-${enh.icon_col * 80}px -${enh.icon_row * 80}px`;

            document.getElementById('modalTitle').innerText = enh.name;
            const typeText = enh.type === 'temporary' ? '⏳ Временное' : '♾️ Постоянное';
            let expiryLine = '';
            if (enh.expiry_text) {
                expiryLine = `<div style="font-size:12px; color:#ffaa44; margin-top:5px;">📅 Годность: ${escapeHtml(enh.expiry_text)}</div>`;
            }
            document.getElementById('modalSubtitle').innerHTML = `⭐ Уровень ${enh.level} | ${typeText}${expiryLine}`;
            
            // Описание + способ получения
            let descriptionHtml = '';
            if (enh.description) {
                descriptionHtml += `<div style="margin-bottom:12px;">${escapeHtml(enh.description)}</div>`;
            }
            if (enh.how_to_get) {
                descriptionHtml += `<div style="background:rgba(199,186,0,0.15); border-left:3px solid #c7ba00; padding:10px 12px; border-radius:8px; margin-top:8px;">
                    <div style="font-size:11px; color:#c7ba00; margin-bottom:5px;">🎯 СПОСОБ ПОЛУЧЕНИЯ:</div>
                    <div style="font-size:12px; color:#ffdd88;">${escapeHtml(enh.how_to_get)}</div>
                </div>`;
            }
            document.getElementById('modalDescription').innerHTML = descriptionHtml || 'Описание отсутствует';

            const statsContainer = document.getElementById('modalStats');
            renderStats(enh.stats || {}, statsContainer);

            document.getElementById('enhancementModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeEnhancementModal() {
            document.getElementById('enhancementModal').style.display = 'none';
            document.body.style.overflow = '';
        }

        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', function () {
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentTypeFilter = this.dataset.type;
                filterAndRender();
            });
        });

        document.getElementById('searchEnhancement').addEventListener('input', function (e) {
            currentSearch = e.target.value.toLowerCase().trim();
            filterAndRender();
        });

        loadEnhancements();
        document.addEventListener('DOMContentLoaded', displayAdminPanel);
    </script>
</body>

</html>
