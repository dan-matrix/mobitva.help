<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нет подключения - Mobitva(МоБитва)</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="/img/books.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <style>
        .error-404-block{text-align:center;padding:50px 20px 30px;}
        .error-404-code{font-family:'Cinzel',Georgia,serif;font-size:56px;font-weight:700;background:linear-gradient(135deg,#d4b35a,#ffdd88);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;margin-bottom:10px;}
        .error-404-title{font-size:20px;color:#e8dcc0;font-weight:bold;margin-bottom:12px;}
        .error-404-text{color:#a8a090;font-size:14px;max-width:420px;margin:0 auto 28px;line-height:1.6;}
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="header-wrapper">
            <div></div>
            <h1 class="site-title">⚔️ MOBITVA ⚔️</h1>
            <div></div>
        </div>
        <div class="error-404-block">
            <div class="error-404-code">📡 Нет связи</div>
            <div class="error-404-title">Не удалось загрузить страницу</div>
            <div class="error-404-text">
                Похоже, пропало подключение к интернету. Данные сайта хранятся на сервере,
                поэтому без сети показать актуальную информацию не получится.
            </div>
            <button class="cat-btn" onclick="location.reload()">🔄 Попробовать снова</button>
        </div>
    </div>
</body>

</html>
